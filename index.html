<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLOWER</title>

<style>
:root {
  --stem-color: #1a3a17;
  --stem-glow: #4ade80;
  --petal-main: #3a7bd5;
  --petal-inner: #8fbfff;
  --petal-edge: #1e4fa3;
  --glow: #9fd3ff;
  --fire-glow: #ffffff;
}

body {
  margin: 0;
  height: 100dvh;
  background: radial-gradient(circle at center, #161a2e, #060811);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  perspective: 1000px;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ================= TEXT ================= */
.quote-container {
  position: fixed;
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  text-align: center;
  pointer-events: none;
  z-index: 20;
  opacity: 0;
  animation: fade-in 2.5s ease-out forwards, float-text 4s ease-in-out infinite;
  animation-delay: 1.5s, 3.5s;
}

.quote-text {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 2rem;
  color: white;
  text-shadow: 0 0 15px var(--glow);
}

.new-year-text {
  font-family: Arial, sans-serif;
  font-size: 1.2rem;
  letter-spacing: 3px;
  color: var(--glow);
  opacity: 0.85;
}

/* ================= FLOWER CONTAINER ================= */
.flower-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: bottom center;
  z-index: 5;
  margin-bottom: 50px;
}

.flower-head {
  position: relative;
  z-index: 10; 
  animation: sway 6s ease-in-out infinite;
}

.petal {
  position: absolute;
  bottom: 0;
  left: 50%;
  background:
    radial-gradient(circle at 50% 10%, var(--fire-glow), transparent 80%),
    linear-gradient(to top, var(--petal-edge), var(--petal-main), var(--petal-inner));
  border-radius: 50% 50% 20% 20% / 80% 80% 20% 20%;
  transform-origin: bottom center;
  opacity: 0;
  box-shadow: inset 0 -5px 10px rgba(0,0,0,0.2);
  animation: bloom-up 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

.core {
  position: absolute;
  width: 35px;
  height: 35px;
  background: radial-gradient(circle, #ffffff, #8fbfff, #1e4fa3);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 15;
  box-shadow: 0 0 25px #fff, 0 0 50px var(--glow);
  animation: pulse-core 2s infinite alternate;
}

/* ================= ENHANCED STEM ================= */
.stem {
  width: 10px; 
  height: 28vh;
  /* 3D Gradient Shading */
  background: linear-gradient(to right, #122b10, var(--stem-color), #2d5a27, #122b10);
  border-radius: 5px;
  position: relative;
  z-index: 2;
  overflow: hidden;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

/* The Energy Vein */
.stem::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 100%;
  background: linear-gradient(to bottom, var(--glow), transparent);
  opacity: 0.4;
  animation: pulse-vein 3s ease-in-out infinite alternate;
}

/* ================= ENHANCED LEAVES ================= */
.leaf {
  position: absolute;
  width: 35px;
  height: 18px;
  background: linear-gradient(135deg, #3f7f3a, #122b10);
  border-radius: 0 100% 0 100%;
  box-shadow: inset 2px 2px 5px rgba(255,255,255,0.1);
}
.leaf.left { left: -30px; top: 60px; transform: rotate(-25deg); }
.leaf.right { right: -35px; top: 110px; transform: rotate(110deg); }

/* ================= ANIMATIONS ================= */
@keyframes pulse-vein {
  0% { opacity: 0.2; height: 10%; }
  100% { opacity: 0.6; height: 100%; }
}

@keyframes bloom-up {
  0% { transform: translateX(-50%) scale(0) rotate(var(--rot)); opacity: 0; }
  30% { opacity: 1; }
  100% { transform: translateX(-50%) scale(1) rotate(var(--rot)); opacity: 1; }
}

@keyframes pulse-core {
  0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 20px #fff; }
  100% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 40px var(--glow); }
}

@keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes float-text { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }

/* ================= PARTICLES & FIREWORKS ================= */
.particle {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0.6;
  animation: float-up var(--duration) linear infinite;
  z-index: 0;
}
@keyframes float-up {
  0% { transform: translateY(0) scale(1); opacity: 0; }
  20% { opacity: 0.7; }
  100% { transform: translateY(-110vh) scale(0.3); opacity: 0; }
}
.firework, .spark { position: fixed; border-radius: 50%; pointer-events: none; z-index: 3; }
.firework { width: 3px; height: 3px; background: white; bottom: -10px; animation: launch 1.5s ease-out forwards; }
@keyframes launch { to { transform: translateY(-75vh); opacity: 0; } }
.spark { width: 4px; height: 4px; animation: explode 1.2s ease-out forwards; }
@keyframes explode { from { transform: translate(0,0); opacity:1; } to { transform: translate(var(--x), var(--y)); opacity:0; } }

@media (max-width:600px) {
  .flower-container { transform: scale(0.65); }
  .quote-text { font-size: 1.6rem; }
}
</style>
</head>

<body>

<div class="quote-container">
  <div class="quote-text">"Everything blooms in its own time."</div>
  <div class="new-year-text">Happy New Year Nicole!</div>
</div>

<div class="flower-container" id="flowerContainer">
  <div class="flower-head" id="flowerHead">
    <div class="core"></div>
  </div>
  <div class="stem">
    <div class="leaf left"></div>
    <div class="leaf right"></div>
  </div>
</div>

<script>
const head = document.getElementById("flowerHead");
const container = document.getElementById("flowerContainer");

/* PETAL ARRAY - NORMAL SIZE */
[[18,50,140,0],[14,45,110,0.5],[11,40,85,1.0],[9,30,60,1.5]]
.forEach(([c,w,h,d])=>{
  for(let i=0;i<c;i++){
    const p=document.createElement("div");
    p.className="petal";
    p.style.width=w+"px";
    p.style.height=h+"px";
    p.style.setProperty("--rot",(360/c*i)+"deg");
    p.style.animationDelay=(d+i*0.08)+"s";
    head.appendChild(p);
  }
});

function handleMove(x, y) {
  const rotY = (x - window.innerWidth / 2) / window.innerWidth * 15;
  const rotX = -(y - window.innerHeight / 2) / window.innerHeight * 8;
  const scale = window.innerWidth <= 600 ? 0.65 : 1;
  container.style.transform = `scale(${scale}) rotateY(${rotY}deg) rotateX(${rotX}deg)`;
}
document.addEventListener("mousemove", e => handleMove(e.clientX, e.clientY));
document.addEventListener("touchmove", e => handleMove(e.touches[0].clientX, e.touches[0].clientY), {passive:true});

function createParticle(){
  const p=document.createElement("div");
  p.className="particle";
  const size=Math.random()*2+1;
  p.style.width=size+"px"; p.style.height=size+"px";
  p.style.left=Math.random()*100+"vw";
  p.style.bottom="-20px";
  p.style.setProperty("--duration",(Math.random()*6+6)+"s");
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),12000);
}
setInterval(createParticle, 500);

function launchFirework(side){
  const fw=document.createElement("div");
  fw.className="firework";
  fw.style.left=side==="left"?"15%":"85%";
  document.body.appendChild(fw);
  setTimeout(()=>{
    fw.remove();
    explode(side==="left"?innerWidth*0.15:innerWidth*0.85, innerHeight*0.3);
  },1400);
}

function explode(x,y){
  const colors=["#6bcfff","#ffffff","#9fd3ff"];
  for(let i=0;i<15;i++){
    const s=document.createElement("div");
    s.className="spark";
    s.style.left=x+"px"; s.style.top=y+"px";
    s.style.background=colors[Math.floor(Math.random()*colors.length)];
    s.style.setProperty("--x",(Math.random()*250-125)+"px");
    s.style.setProperty("--y",(Math.random()*250-125)+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1200);
  }
}
setInterval(()=>launchFirework("left"),6000);
setInterval(()=>launchFirework("right"),7500);
</script>
</body>
</html>
