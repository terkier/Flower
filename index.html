<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flower</title>
    <link href="https://fonts.googleapis.com/css2?family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <style>
      :root {
        --stem-color: #2d5a27;

        /* HEY..*/
        --petal-main: #3a7bd5;
        --petal-inner: #8fbfff;
        --petal-edge: #1e4fa3;

        --glow: #9fd3ff;
      }

      body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at center, #161a2e, #060811);
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 50px;
        perspective: 1000px;
        touch-action: manipulation;
      }

      /* I wish I could confess to you but I already know the answer*/

      .quote-container {
        position: fixed;
        top: 18%;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        text-align: center;
        pointer-events: none;
        z-index: 9999;

        opacity: 0;
        animation: fade-in 2.5s ease-out forwards,
          float-text 4s ease-in-out infinite;
        animation-delay: 0.5s, 2.5s;
      }

      .quote-text {
        font-family: "Winky Rough";;
        font-style: italic;
        font-size: 2.5rem;
        color: white;
        text-shadow: 0 0 12px var(--glow);
        margin-bottom: 10px;
        padding: 0 20px;
      }

      .new-year-text {
        font-family: "Winky Rough";
        font-size: 1.8rem;
        letter-spacing: 4px;
        color: var(--glow);
        text-transform: uppercase;
        opacity: 0.85;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      @keyframes float-text {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(-15px);
        }
      }

      /* Someday I'll get your attention */

      .flower-container {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform-origin: bottom center;
        transition: transform 0.2s ease-out;
      }

      .flower-head {
        position: relative;
        width: 0;
        height: 0;
        z-index: 1;
        animation: sway 6s ease-in-out infinite;
        isolation: isolate;
      }

      .petal {
        position: absolute;
        bottom: 0;
        left: 50%;

        background:
          radial-gradient(circle at 50% 15%, rgba(255,255,255,0.45), transparent 60%),
          linear-gradient(
            to top,
            var(--petal-edge),
            var(--petal-main),
            var(--petal-inner)
          );

        border-radius: 50% 50% 25% 25% / 80% 80% 20% 20%;
        transform-origin: bottom center;
        opacity: 0;

        box-shadow:
          inset 0 -10px 20px rgba(0, 0, 0, 0.25),
          inset 0 10px 20px rgba(255, 255, 255, 0.15),
          0 0 12px rgba(120, 180, 255, 0.35);

        animation: bloom-up 3s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards;
      }

      .petal::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to top,
          rgba(255,255,255,0.12),
          rgba(255,255,255,0.12) 1px,
          transparent 6px
        );
        border-radius: inherit;
        opacity: 0.4;
        pointer-events: none;
      }

      .core {
        position: absolute;
        width: 45px;
        height: 45px;
        background: radial-gradient(circle, #e8f6ff, #4fa3ff);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        box-shadow: 0 0 45px var(--glow);
        animation: pulse 2s infinite;
      }

      .stem {
        width: 10px;
        height: 300px;
        background: linear-gradient(to bottom, var(--stem-color), #1a3316);
        border-radius: 5px;
        margin-top: -10px;
        position: relative;
        z-index: 0;
      }

      .leaf {
        position: absolute;
        width: 50px;
        height: 25px;
        background: linear-gradient(to right, #3f7f3a, var(--stem-color));
        border-radius: 0 100% 0 100%;
      }

      .leaf.left {
        left: -45px;
        top: 120px;
        transform: rotate(-25deg);
      }

      .leaf.right {
        right: -55px;
        top: 180px;
        transform: rotate(110deg);
      }

      /* If it meant to be then I'll see you later*/

      .particle {
        position: absolute;
        background: var(--glow);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.6;
        filter: blur(1px);
        animation: float-up var(--duration) linear infinite;
        z-index: 0;
      }

      /* Thank you for being you.*/

      @keyframes bloom-up {
        0% {
          transform: translateX(-50%) scale(0) rotate(var(--rot));
          opacity: 0;
        }
        100% {
          transform: translateX(-50%) scale(1) rotate(var(--rot));
          opacity: 1;
        }
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
        }
      }

      @keyframes float-up {
        0% {
          transform: translateY(0) scale(1);
          opacity: 0;
        }
        20% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(-100vh) scale(0.5);
          opacity: 0;
        }
      }

      /* Merry christmas and happy new year! */

      @media (max-width: 600px) {
        .quote-text {
          font-size: 1.2rem;
        }

        .new-year-text {
          font-size: 0.7rem;
          letter-spacing: 3px;
        }

        .flower-container {
          transform: scale(0.8);
        }

        body {
          padding-bottom: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="quote-container">
      <div class="quote-text">"Everything blooms in its own time."</div>
      <div class="new-year-text">Happy New Year Nicole!</div>
    </div>

    <div class="flower-container" id="flowerContainer">
      <div class="flower-head" id="flowerHead">
        <div class="core"></div>
      </div>
      <div class="stem">
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>
    </div>

    <script>
      const head = document.getElementById("flowerHead");
      const container = document.getElementById("flowerContainer");

      const layers = [
        [16, 75, 220, 0],
        [13, 65, 190, 0.4],
        [11, 55, 150, 0.8],
        [9, 40, 100, 1.2],
      ];

      layers.forEach(([count, w, h, delay]) => {
        for (let i = 0; i < count; i++) {
          const p = document.createElement("div");
          p.className = "petal";
          p.style.setProperty("--rot", `${(360 / count) * i}deg`);
          p.style.width = `${w}px`;
          p.style.height = `${h}px`;
          p.style.animationDelay = `${delay + i * 0.1}s`;
          head.appendChild(p);
        }
      });

      function tilt(x, y) {
        container.style.transform = `rotateY(${x * 15}deg) rotateX(${ -y * 10 }deg)`;
      }

      document.addEventListener("mousemove", (e) => {
        tilt(
          (e.clientX - innerWidth / 2) / (innerWidth / 2),
          (e.clientY - innerHeight / 2) / (innerHeight / 2)
        );
      });

      document.addEventListener(
        "touchmove",
        (e) => {
          const t = e.touches[0];
          tilt(
            (t.clientX - innerWidth / 2) / (innerWidth / 2),
            (t.clientY - innerHeight / 2) / (innerHeight / 2)
          );
        },
        { passive: true }
      );

      function createParticle() {
        const p = document.createElement("div");
        p.className = "particle";
        const size = Math.random() * 4 + 2;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${Math.random() * 100}vw`;
        p.style.bottom = "-10px";
        p.style.setProperty("--duration", `${Math.random() * 5 + 5}s`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 10000);
      }

      setInterval(createParticle, 300);
    </script>
  </body>
</html>
