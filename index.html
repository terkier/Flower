<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For you</title>

<style>
:root {
  --pot-color: #2c3e50;
  --pot-rim: #34495e;
  --blue-main: #0026ff;
  --blue-edge: #000b4d;
  --white-main: #ffffff;
  --white-edge: #d1d1d1;
}

body {
  margin: 0;
  height: 100dvh;
  background: radial-gradient(circle at center, #0a0c1a, #020308);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  perspective: 1000px;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}


.quote-container {
  position: fixed;
  top: 8%;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  text-align: center;
  z-index: 100;
  opacity: 0;
  animation: fade-in 2s ease-out forwards;
}

.quote-text {
  font-family: "Winky Rough";
  font-style: italic;
  font-size: 2.5rem;
  color: white;
  text-shadow: 0 0 15px #4d66ff;
  margin-bottom: 5px;
}

.happy-new-year {
  font-family: "Winky Rough";
  font-size: 1.8rem;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 0 0 10px #fff, 0 0 20px #0026ff;
  opacity: 0.9;
}


.pot-container {
  position: relative;
  width: 100%;
  height: 60vh;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  margin-bottom: -10px;
}

.pot {
  position: absolute;
  bottom: 0;
  width: 100px;
  height: 80px;
  background: linear-gradient(to right, #1a252f, var(--pot-color), #34495e);
  border-radius: 5px 5px 20px 20px;
  z-index: 20;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.pot-rim {
  position: absolute;
  bottom: 75px;
  width: 110px;
  height: 15px;
  background: var(--pot-rim);
  border-radius: 5px;
  z-index: 21;
}


.flower-container {
  position: absolute;
  bottom: 40px; 
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: bottom center;
}

.f1 { transform: rotate(-22deg) scale(0.8); }
.f2 { transform: rotate(-10deg) scale(0.9); z-index: 8; }
.f3 { transform: rotate(0deg) scale(1); z-index: 10; }
.f4 { transform: rotate(10deg) scale(0.9); z-index: 8; }
.f5 { transform: rotate(22deg) scale(0.8); }

.flower-head { position: relative; z-index: 10; animation: sway 6s ease-in-out infinite; }

.petal {
  position: absolute;
  bottom: 0;
  left: 50%;
  border-radius: 50% 50% 20% 20% / 80% 80% 20% 20%;
  transform-origin: bottom center;
  opacity: 0;
  box-shadow: inset 0 -5px 8px rgba(0,0,0,0.3);
  animation: bloom-up 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

.blue .petal { background: linear-gradient(to top, var(--blue-edge), var(--blue-main), #4d66ff); }
.white .petal { background: linear-gradient(to top, var(--white-edge), var(--white-main), #ffffff); }

.core {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 15;
  background: radial-gradient(circle, #fff, #999);
}

.stem {
  width: 5px;
  height: 25vh;
  background: linear-gradient(to bottom, #1a3a17, #0d1a0b);
  border-radius: 2px;
}


.firework-projectile {
  position: fixed;
  width: 4px;
  height: 4px;
  background: #fff;
  border-radius: 50%;
  z-index: 50;
  box-shadow: 0 0 10px #fff;
}

.firework-spark {
  position: fixed;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  z-index: 50;
  pointer-events: none;
}


.baby-breath {
  position: absolute;
  background: white;
  border-radius: 50%;
  filter: blur(1px);
  opacity: 0.6;
  pointer-events: none;
  animation: float-up var(--d) linear infinite;
}

@keyframes bloom-up {
  to { transform: translateX(-50%) scale(1) rotate(var(--r)); opacity: 1; }
}
@keyframes float-up {
  0% { transform: translateY(0); opacity: 0; }
  50% { opacity: 0.7; }
  100% { transform: translateY(-100vh); opacity: 0; }
}
@keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes fade-in { to { opacity: 1; } }

@media (max-width: 600px) {
  .pot-container { transform: scale(0.85); }
  .quote-text { font-size: 1.4rem; }
  .happy-new-year { font-size: 1.1rem; }
}
</style>
</head>
<body>

<div class="quote-container">
  <div class="quote-text">"Everything blooms in its own time."</div>
  <div class="happy-new-year">Happy New Year!</div>
</div>

<div class="pot-container" id="bouquet">
  <div class="pot"></div>
  <div class="pot-rim"></div>
  
  <div class="flower-container f1 white"><div class="flower-head" id="h1"><div class="core"></div></div><div class="stem"></div></div>
  <div class="flower-container f2 blue"><div class="flower-head" id="h2"><div class="core"></div></div><div class="stem"></div></div>
  <div class="flower-container f3 white"><div class="flower-head" id="h3"><div class="core"></div></div><div class="stem"></div></div>
  <div class="flower-container f4 blue"><div class="flower-head" id="h4"><div class="core"></div></div><div class="stem"></div></div>
  <div class="flower-container f5 white"><div class="flower-head" id="h5"><div class="core"></div></div><div class="stem"></div></div>
</div>

<script>
function drawFlower(id, delay) {
  const h = document.getElementById(id);
  const config = [[12, 40, 95, 0], [10, 32, 65, 0.4], [8, 22, 40, 0.8]];
  config.forEach(([c, w, h_val, d]) => {
    for(let i=0; i<c; i++){
      const p = document.createElement("div");
      p.className = "petal";
      p.style.width = w+"px"; p.style.height = h_val+"px";
      p.style.setProperty("--r", (360/c*i)+"deg");
      p.style.animationDelay = (delay + d + (i*0.06))+"s";
      h.appendChild(p);
    }
  });
}

drawFlower("h3", 0.2); 
drawFlower("h2", 0.7); 
drawFlower("h4", 0.7);
drawFlower("h1", 1.2); 
drawFlower("h5", 1.2);

setInterval(() => {
  const b = document.createElement("div");
  b.className = "baby-breath";
  const s = Math.random()*3+2;
  b.style.width = s+"px"; b.style.height = s+"px";
  b.style.left = Math.random()*100+"vw";
  b.style.bottom = "10vh";
  b.style.setProperty("--d", (Math.random()*5+5)+"s");
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 10000);
}, 400);

function launchFirework(side) {
  const startX = side === 'left' ? Math.random() * 20 + 5 : Math.random() * 20 + 75;
  const projectile = document.createElement('div');
  projectile.className = 'firework-projectile';
  projectile.style.left = startX + 'vw';
  projectile.style.bottom = '0';
  document.body.appendChild(projectile);

  const targetY = Math.random() * 40 + 40; 
  const duration = 1200; 
  
  projectile.animate([
    { bottom: '0', opacity: 1 },
    { bottom: targetY + 'vh', opacity: 1, offset: 0.9 },
    { bottom: targetY + 'vh', opacity: 0 }
  ], {
    duration: duration,
    easing: 'ease-out'
  }).onfinish = () => {
    projectile.remove();
    createExplosion(startX, targetY);
  };
}

function createExplosion(x, y) {
  const colors = ['#0026ff', '#00ffcc', '#ffffff', '#ff00ff', '#0099ff'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  const sparkCount = 40;

  for (let i = 0; i < sparkCount; i++) {
    const spark = document.createElement('div');
    spark.className = 'firework-spark';
    spark.style.backgroundColor = color;
    spark.style.left = x + 'vw';
    spark.style.bottom = y + 'vh';
    spark.style.boxShadow = `0 0 8px ${color}`;
    document.body.appendChild(spark);

    const angle = (Math.PI * 2 / sparkCount) * i;
    const velocity = Math.random() * 15 + 5;
    const vx = Math.cos(angle) * velocity;
    const vy = Math.sin(angle) * velocity;

    spark.animate([
      { transform: 'translate(0, 0)', opacity: 1 },
      { transform: `translate(${vx}vw, ${-vy}vh)`, opacity: 0 }
    ], {
      duration: 1000 + Math.random() * 500,
      easing: 'cubic-bezier(0, .9, .57, 1)'
    }).onfinish = () => spark.remove();
  }
}

setTimeout(() => {
  setInterval(() => launchFirework('left'), 3000);
  setTimeout(() => {
    setInterval(() => launchFirework('right'), 3000);
  }, 1500);
}, 2000);

document.addEventListener("touchmove", e => {
  const rot = (e.touches[0].clientX - window.innerWidth/2) / 15;
  document.getElementById("bouquet").style.transform = `rotateY(${rot}deg)`;
}, {passive: true});
</script>
</body>
</html>
