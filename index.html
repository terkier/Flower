<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLOWER</title>

<style>
:root {
  --stem-color: #2d5a27;
  --petal-main: #3a7bd5;
  --petal-inner: #8fbfff;
  --petal-edge: #1e4fa3;
  --glow: #9fd3ff;
  --fire-glow: #ffffff;
}

body {
  margin: 0;
  height: 100dvh;
  background: radial-gradient(circle at center, #161a2e, #060811);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding-bottom: 50px;
  perspective: 1000px;
 
  touch-action: none; 
}

.quote-container {
  position: fixed;
  top: 15%;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  text-align: center;
  pointer-events: none;
  z-index: 20;
  opacity: 0;
  animation: fade-in 2.5s ease-out forwards,
             float-text 4s ease-in-out infinite;
  animation-delay: 1.5s, 3.5s;
}

.quote-text {
  font-family: "Winky Rough", Georgia, serif; 
  font-style: italic;
  font-size: 2.5rem;
  color: white;
  text-shadow: 0 0 15px var(--glow), 0 0 30px var(--glow);
}

.new-year-text {
  font-family: "Winky Rough", Arial, sans-serif;
  font-size: 1.8rem;
  letter-spacing: 4px;
  color: var(--glow);
  opacity: 0.85;
}

.flower-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: bottom center;
  transition: transform 0.2s ease-out;
  z-index: 5;
}

.flower-head {
  position: relative;
  z-index: 10; 
  animation: sway 6s ease-in-out infinite;
}

.petal {
  position: absolute;
  bottom: 0;
  left: 50%;
  background:
    radial-gradient(circle at 50% 10%, var(--fire-glow), transparent 70%),
    linear-gradient(to top, var(--petal-edge), var(--petal-main), var(--petal-inner));
  border-radius: 50% 50% 25% 25% / 80% 80% 20% 20%;
  transform-origin: bottom center;
  opacity: 0;
  box-shadow: inset 0 -10px 20px rgba(0,0,0,0.3);
  animation: bloom-up 3s cubic-bezier(.17,.67,.83,.67) forwards,
             petal-glow 4s ease-in-out infinite alternate;
}

.petal::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(to top, rgba(255,255,255,0.1) 0, rgba(255,255,255,0.1) 1px, transparent 6px);
  border-radius: inherit;
  opacity: 0.3;
}

.core {
  position: absolute;
  width: 50px;
  height: 50px;
  background: radial-gradient(circle, #ffffff, #8fbfff, #1e4fa3);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 15;
  box-shadow: 0 0 50px #fff, 0 0 100px var(--glow);
  animation: pulse-core 2s infinite alternate;
}

.stem {
  width: 10px;
  height: 380px;
  background: linear-gradient(to bottom, var(--stem-color), #0a1108);
  border-radius: 5px;
  margin-top: -10px;
  position: relative;
  z-index: 1;
}


@media (max-height: 700px) {
  .stem { height: 30vh; }
}

.leaf {
  position: absolute;
  width: 50px;
  height: 25px;
  background: linear-gradient(to right, #3f7f3a, var(--stem-color));
  border-radius: 0 100% 0 100%;
}
.leaf.left { left: -45px; top: 120px; transform: rotate(-25deg); }
.leaf.right { right: -55px; top: 180px; transform: rotate(110deg); }

@keyframes bloom-up {
  from { transform: translateX(-50%) scale(0) rotate(var(--rot)); opacity: 0; }
  to { transform: translateX(-50%) scale(1) rotate(var(--rot)); opacity: 1; }
}
@keyframes petal-glow {
  0% { filter: brightness(1) drop-shadow(0 0 5px var(--glow)); }
  100% { filter: brightness(1.4) drop-shadow(0 0 15px #fff); }
}
@keyframes pulse-core {
  0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 40px #fff; }
  100% { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 80px #fff, 0 0 120px var(--glow); }
}
@keyframes fade-in {
  from { opacity: 0; transform: translate(-50%, 20px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes float-text {
  0%,100% { transform: translate(-50%, 0); }
  50% { transform: translate(-50%, -15px); }
}
@keyframes sway {
  0%,100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}

.particle {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 10px var(--glow);
  animation: float-up var(--duration) linear infinite;
  z-index: 0;
}
@keyframes float-up {
  0% { transform: translateY(0) scale(1); opacity: 0; }
  50% { opacity: 0.8; }
  100% { transform: translateY(-110vh) scale(0); opacity: 0; }
}

.firework, .spark { position: fixed; border-radius: 50%; pointer-events: none; z-index: 3; }
.firework { width: 4px; height: 4px; background: white; bottom: -10px; animation: launch 1.5s ease-out forwards; }
@keyframes launch { to { transform: translateY(-75vh); opacity: 0; } }
.spark { width: 6px; height: 6px; animation: explode 1.2s ease-out forwards; }
@keyframes explode {
  from { transform: translate(0,0) scale(1); opacity:1; }
  to { transform: translate(var(--x), var(--y)) scale(0); opacity:0; }
}

@media (max-width:600px) {
  .quote-text { font-size: 1.5rem; } /* Slightly larger than before but stable */
  .new-year-text { font-size: 1.2rem; }
  .flower-container { transform: scale(0.7); transform-origin: bottom center; }
}
</style>
</head>

<body>

<div class="quote-container">
  <div class="quote-text">"Everything blooms in its own time."</div>
  <div class="new-year-text">Happy New Year Nicole!</div>
</div>

<div class="flower-container" id="flowerContainer">
  <div class="flower-head" id="flowerHead">
    <div class="core"></div>
  </div>
  <div class="stem">
    <div class="leaf left"></div>
    <div class="leaf right"></div>
  </div>
</div>

<script>
const head = document.getElementById("flowerHead");
const container = document.getElementById("flowerContainer");

[[18,80,230,0],[14,70,200,0.5],[11,60,160,1.0],[9,45,110,1.5]]
.forEach(([c,w,h,d])=>{
  for(let i=0;i<c;i++){
    const p=document.createElement("div");
    p.className="petal";
    p.style.width=w+"px";
    p.style.height=h+"px";
    p.style.setProperty("--rot",(360/c*i)+"deg");
    p.style.animationDelay=(d+i*0.1)+"s";
    head.appendChild(p);
  }
});

function handleMove(x, y) {
  const rotY = (x - window.innerWidth / 2) / window.innerWidth * 25;
  const rotX = -(y - window.innerHeight / 2) / window.innerHeight * 15;
  container.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg)`;
}
document.addEventListener("mousemove", e => handleMove(e.clientX, e.clientY));
document.addEventListener("touchmove", e => {
  handleMove(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:true});

function createParticle(){
  const p=document.createElement("div");
  p.className="particle";
  const size=Math.random()*3+1;
  p.style.width=size+"px"; p.style.height=size+"px";
  p.style.left=Math.random()*100+"vw";
  p.style.bottom="-20px";
  p.style.setProperty("--duration",(Math.random()*5+5)+"s");
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),10000);
}
setInterval(createParticle,250);

function launchFirework(side){
  const fw=document.createElement("div");
  fw.className="firework";
  fw.style.left=side==="left"?"15%":"85%";
  document.body.appendChild(fw);
  setTimeout(()=>{
    fw.remove();
    explode(side==="left"?innerWidth*0.15:innerWidth*0.85, innerHeight*0.3);
  },1400);
}

function explode(x,y){
  const colors=["#6bcfff","#ffffff","#9fd3ff","#4fa3ff","#c77dff"];
  for(let i=0;i<30;i++){
    const s=document.createElement("div");
    s.className="spark";
    s.style.left=x+"px"; s.style.top=y+"px";
    s.style.background=colors[Math.floor(Math.random()*colors.length)];
    s.style.setProperty("--x",(Math.random()*400-200)+"px");
    s.style.setProperty("--y",(Math.random()*400-200)+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1200);
  }
}
setInterval(()=>launchFirework("left"),4000);
setInterval(()=>launchFirework("right"),5500);
</script>
</body>
</html>
